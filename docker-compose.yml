services:
  db:
    image: postgres:15-alpine
    container_name: cinema-db
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
    ports:
      - "5433:5432"
    volumes:
      - cinema_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    container_name: cinema-server
    environment:
      DATABASE_URL: postgresql://cinema:cinema@db:5432/cinema?schema=public
      JWT_SECRET: cinema-demo-secret-9f8e7d6c5b4a3210
      PORT: "4000"
      DEMO_MODE: "1"
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: admin123
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  client:
    build: ./client
    container_name: cinema-client
    environment:
      API_PROXY_TARGET: http://server:4000
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy

volumes:
  cinema_pgdata: